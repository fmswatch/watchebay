name: Panerai Ebay Watch Appraisal Daily Report

on:
  schedule:
    # Günde 1 kez (Her gün saat 08:00 UTC / 11:00 TSI)
    - cron: '0 8 * * *'
    
    # EGER 2 GUNDE 1 OLMASINI ISTERSENIZ ustteki satiri silip sunu kullanin:
    # - cron: '0 8 */2 * *'

  workflow_dispatch: # İhtiyaç olursa manuel tetikleme butonu da durur

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scripti Çalıştır
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python main.py
